<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautify With Jess</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <!-- Navigation -->
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/services">Services</a></li>
                <li><a href="/gallery">Gallery</a></li>
                <li><a href="/booking">Book Now</a></li>
                <li><a href="/contact">Enquiry</a></li>
                <li><a href="/meetjess">Meet Jess</a></li>
            </ul>
        </nav>
    </header>

    <!-- Allowing users to edit an existing booking improves effectiveness by increasing
     the accuracy of booking information and improving usability. It also improves
     efficiency by updating the existing database record instead of requiring the
     user to submit a new booking, reducing duplicate data. -->

    <main>
        <h2>Edit Your Appointment</h2>

        <p>
            Update your booking details below.
        </p>

        <form action="/edit_booking/{{ booking[0] }}" method="POST">

            <label for="customer_name">Full Name:</label>
            <input type="text" id="customer_name" name="customer_name" value="{{ booking[1] }}" maxlength="50" required><br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" value="{{ booking[2] }}" pattern="^04\d{8}$" maxlength="10" required><br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" value="{{ booking[3] }}" pattern="^.+@.+\..+$" required><br><br>

            <label for="service">Service:</label>

            <select id="service" name="service" required>

                {% for service in services %}

                    <option value="{{ service }}" {% if service == booking[4] %}selected{% endif %}>
                        {{ service }}
                    </option>

                {% endfor %}

            </select><br><br>

            <label for="booking_date">Preferred Date:</label>
            <input type="date" id="booking_date" name="booking_date" value="{{ booking[5] }}" required><br><br>

            <label for="booking_time">Preferred Time:</label>
            <input type="time" id="booking_time" name="booking_time" value="{{ booking[6] }}" required>
            <br><br>

            <button type="submit">Save Changes</button>

        </form>
    </main>
    <footer>
        <p>© 2026 Beautify With Jess</p>
    </footer>
</body>
</html>
