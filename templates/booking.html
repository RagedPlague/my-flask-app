<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!--- this makes the website display well on every device not just pc -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beautify With Jess</title>

    <!--- url_for() finds style.css in static folder, does not work if just href=style.css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/services">Services</a></li>
                <li><a href="/gallery">Gallery</a></li>
                <li><a href="/booking">Book Now</a></li>
                <li><a href="/contact">Contact</a></li>
                <li><a href="/meetjess">Meet Jess</a></li>
            </ul>
        </nav>
    </header>
    <br>

    <main>

        <h2>Book Your Appointment</h2>

        <p>
            Complete the form below to book your beauty appointment.
        </p>

        <!-- If an error message is sent from Flask (such as an unavailable booking time),
     display the error message to user -->
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form action="/add_booking" method="POST">

            <label for="customer_name">Full Name</label>
            <input type="text" id="customer_name" name="customer_name" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="service">Service</label>

            <select id="service" name="service" required>

                <!-- Loop through each service in 'services' in app.py and create a dropdown option for each one -->
                {% for service in services %}

                    <option value="{{ service }}">

                        {{ service }}

                    </option>

                {% endfor %}

            </select>

            <label for="booking_date">Preferred Date</label>
            <input type="date" id="booking_date" name="booking_date" required>

            <label for="booking_time">Preferred Time</label>
            <input type="time" id="booking_time" name="booking_time" required>
            <br><br>

            <button type="submit">Confirm Booking</button>
        </form>
    </main>
    <footer>
        <p>© 2026 Beautify With Jess</p>
    </footer>
</body>
</html>
